name: Unpack Marketplace Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p /tmp/scanner
          unzip -o marketplace-scanner-v1.zip -d /tmp/scanner
          cp -a /tmp/scanner/marketplace-scanner/. .
          rm -f marketplace-scanner-v1.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install Marketplace Scanner V1"
          git push
